<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox ChatGPT Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#f4f7ff;height:100vh;display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid #252d45;display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}.tools{display:flex;gap:8px}input,button,textarea{font:inherit}#key{width:260px;background:#11182b;border:1px solid #34405f;color:#fff;border-radius:8px;padding:8px}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}#clear{background:#25304b;color:#fff}.wrap{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1100px;width:100%;margin:auto}.chat{flex:1;overflow:auto;padding:24px}.msg{max-width:850px;padding:12px 15px;border-radius:14px;margin:0 0 12px;white-space:pre-wrap;line-height:1.45}.assistant{background:#151d32;border:1px solid #26304b}.user{background:#304a79;margin-left:auto}.composer{padding:15px;border-top:1px solid #252d45;display:flex;gap:10px}#input{flex:1;resize:none;height:56px;background:#11182b;border:1px solid #34405f;color:#fff;border-radius:10px;padding:12px}#send{background:#6c7cff;color:white;font-weight:700}#status{font-size:12px;color:#99a8c8}
</style></head>
<body>
<header><h1>🤖 Roblox ChatGPT Builder</h1><div class="tools"><input id="key" type="password" placeholder="API key aplikasi" autocomplete="off"><button id="clear">Clear</button></div></header>
<div class="wrap"><div id="chat" class="chat"><div class="msg assistant">Hi! Saya boleh bantu bina game Roblox. Masukkan API key aplikasi anda, kemudian taip arahan seperti: “Buat sistem profile player dengan LikeButton.”</div></div>
<div id="status">Offline sehingga API key dimasukkan</div>
<form id="form" class="composer"><textarea id="input" placeholder="Tulis apa yang nak AI buat dalam Roblox Studio..."></textarea><button id="send" type="submit">Hantar</button></form></div>
<script src="/app.js"></script>
</body></html>
